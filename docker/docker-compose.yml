# ============================================================
#  DocFlow — Docker Compose (Full Stack)
#  Services: API · Streamlit UI · PostgreSQL · Redis · ChromaDB
# ============================================================
version: "3.9"

x-common-env: &common-env
  APP_ENV: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://docflow:docflow@postgres:5432/docflow
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CHROMA_PERSIST_DIR: /app/data/chroma
  FAISS_INDEX_PATH: /app/data/faiss/index.bin
  UPLOAD_DIR: /app/data/uploads
  OUTPUT_DIR: /app/data/outputs
  TEMP_DIR: /app/data/temp
  MODEL_CACHE_DIR: /app/data/models
  VECTOR_STORE: chroma
  EMBEDDING_PROVIDER: sentence_transformers
  EMBEDDING_MODEL: all-MiniLM-L6-v2
  WHISPER_MODEL: base
  WHISPER_DEVICE: cpu
  OCR_ENGINE: auto
  OCR_USE_GPU: "false"

services:
  # ── FastAPI Backend ──────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docflow-api:latest
    container_name: docflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      API_WORKERS: 4
    volumes:
      - docflow-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - docflow-net

  # ── Streamlit Dashboard ──────────────────────────────────
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docflow-ui:latest
    container_name: docflow-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      <<: *common-env
    volumes:
      - docflow-data:/app/data
    depends_on:
      - api
    command: >
      streamlit run frontend/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    networks:
      - docflow-net

  # ── Celery Worker (Background Tasks) ─────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docflow-worker:latest
    container_name: docflow-worker
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - docflow-data:/app/data
    depends_on:
      - redis
      - postgres
    command: celery -A core.celery_app worker --loglevel=info --concurrency=2
    networks:
      - docflow-net

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: docflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docflow-net

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docflow-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docflow-net

  # ── Prometheus (Metrics) ──────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: docflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - docflow-net
    profiles:
      - monitoring

  # ── Grafana (Dashboards) ──────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: docflow-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: docflow
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - docflow-net
    profiles:
      - monitoring

volumes:
  docflow-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  docflow-net:
    driver: bridge
