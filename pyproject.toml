[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "docflow"
version = "1.0.0"
description = "Universal AI Document Intelligence & Markdown Conversion Platform"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "DocFlow Team"}]
requires-python = ">=3.10"

dependencies = [
    # Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",

    # Document Parsers
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.3",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "trafilatura>=1.8.0",
    "markdown>=3.6",
    "html2text>=2024.2.26",

    # OCR
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    "opencv-python-headless>=4.9.0.80",
    "easyocr>=1.7.1",

    # Audio / Video
    "openai-whisper>=20231117",
    "yt-dlp>=2024.3.10",
    "youtube-transcript-api>=0.6.2",
    "pydub>=0.25.1",

    # AI / LLM
    "openai>=1.14.0",
    "anthropic>=0.20.0",
    "ollama>=0.1.8",
    "tiktoken>=0.6.0",

    # Embeddings
    "sentence-transformers>=2.5.1",

    # Vector Stores
    "chromadb>=0.4.24",
    "faiss-cpu>=1.8.0",

    # LangChain
    "langchain>=0.1.12",
    "langchain-community>=0.0.29",
    "langchain-openai>=0.1.1",
    "langchain-text-splitters>=0.0.1",
    "llama-index>=0.10.17",

    # Database
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",

    # Caching & Queue
    "redis>=5.0.3",
    "celery>=5.3.6",

    # Utilities
    "loguru>=0.7.2",
    "python-magic>=0.4.27",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "tqdm>=4.66.2",
    "tenacity>=8.2.3",
    "xxhash>=3.4.1",
    "chardet>=5.2.0",
    "PyYAML>=6.0.1",
    "toml>=0.10.2",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",

    # Monitoring
    "prometheus-client>=0.20.0",
    "sentry-sdk>=1.42.0",
]

[project.optional-dependencies]
gpu = [
    "paddlepaddle-gpu",
    "paddleocr>=2.7.3",
    "faster-whisper>=0.10.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]
cpu = [
    "paddlepaddle",
    "paddleocr>=2.7.3",
    "faster-whisper>=0.10.0",
]
ui = [
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "streamlit-extras>=0.4.2",
]
desktop = [
    "PySide6>=6.6.2",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.2.0",
    "ruff>=0.3.2",
    "mypy>=1.9.0",
    "locust>=2.24.0",
]
all = ["docflow[gpu,ui,desktop,dev]"]

[project.scripts]
docflow = "core.cli:main"
docflow-api = "api.main:start"
docflow-ui = "frontend.app:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
